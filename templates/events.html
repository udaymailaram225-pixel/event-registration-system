{% extends "base.html" %}
{% block content %}
<h2>Upcoming Events</h2>
<table>
  <tr><th>Event</th><th>Date</th><th>Venue</th><th>Details</th><th></th></tr>
  {% for e in events %}
  <tr>
    <td>{{ e.title }}</td>
    <td>{{ e.date }}</td>
    <td>{{ e.venue }}</td>
    <td>{{ e.description }}</td>
    <td>
      <form method="post" action="{{ url_for('register_event', event_id=e.id) }}">
        <button type="submit" id="reg-{{ e.id }}">Register</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
